server:
  port: 9000

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

    instance:
      prefer-ip-address: true

cloudflow:
  security:
    enabled: true
    authentication-enabled: false
    csrf-enabled: false
    cors-enabled: true
    stateless: true
    public-urls:
      - /api/v1/auth/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /actuator/**

endpoints:
  web:
    exposure:
      include: "*"

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
