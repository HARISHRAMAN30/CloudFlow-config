server:
  port: ${SERVER_PORT:9001}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudflow_auth
    username: postgres
    password: password

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        auto_quote_keyword: true
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration

cloudflow:
  security:
    enabled: true
    authentication-enabled: false
    csrf-enabled: false
    cors-enabled: true
    stateless: true
    public-urls:
      - /api/v1/auth/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /actuator/**

  redis:
    enabled: true
    key-prefix: cloudflow
eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.springframework.security: INFO




