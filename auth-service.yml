server:
  port: 9001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudflow_auth
    username: postgres
    password: password

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        auto_quote_keyword: true
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/




